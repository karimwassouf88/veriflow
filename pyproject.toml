[project]
name = "veriflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.12",
    "email-validator>=2.3.0",
    "aiofiles>=25.1.0",
    "pdfplumber>=0.11.10",
    "groq>=1.7.0",
    "qdrant-client[fastembed]>=1.19.0",
    "langgraph>=1.2.11",
    "structlog>=26.1.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
